name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Skip Android lint (not needed for the APK, and it crashes on some plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          printf '%s\n' 'allprojects {' '  tasks.configureEach { t ->' '    if (t.name.startsWith("lintVital")) { t.enabled = false }' '  }' '}' > ~/.gradle/init.d/skip-lint.gradle

      - name: Generate the Android project
        run: flutter create --platforms=android --org pk.aspire --project-name aspire_chat .

      - name: Patch Android settings (package id, internet, app name, minSdk)
        run: |
          PKG=$(cat android_package.txt 2>/dev/null | tr -d '\r\n ')
          M=android/app/src/main/AndroidManifest.xml
          G=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if [ -n "$PKG" ]; then
            sed -i "s/applicationId = \"[^\"]*\"/applicationId = \"$PKG\"/; s/applicationId \"[^\"]*\"/applicationId \"$PKG\"/" "$G"
          fi
          grep -q "android.permission.INTERNET" "$M" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          sed -i 's/android:label="[^"]*"/android:label="Aspire Chat"/' "$M"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
          echo "--- applicationId / minSdk"; grep -n "applicationId\|minSdk" "$G" || true

      - name: Prepare the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Secret check (lengths only): KEYSTORE_BASE64=${#KEYSTORE_BASE64} KEYSTORE_PASSWORD=${#STORE_PASSWORD} KEY_ALIAS=${#KEY_ALIAS} KEY_PASSWORD=${#KEY_PASSWORD}"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key secrets found. Add the four signing secrets. Build stopped."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aspire-release.jks"
          echo "SIGN_KEYSTORE_PATH=$RUNNER_TEMP/aspire-release.jks" >> "$GITHUB_ENV"
          echo "SIGN_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/aspire-release.jks" -storepass "$STORE_PASSWORD" | head -6

      - name: Apply the signing key to the Android project
        run: |
          if [ -z "$SIGN_KEYSTORE_PATH" ]; then echo "Signing key missing."; exit 1; fi
          python3 ci/apply_signing.py

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Verify the APK is signed with the permanent key
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v --print-certs "$APK" | head -15 || true
          EXPECTED=$(keytool -list -v -keystore "$SIGN_KEYSTORE_PATH" -storepass "$SIGN_STORE_PASSWORD" -alias "$SIGN_KEY_ALIAS" | grep "SHA256:" | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "Keystore SHA256: $EXPECTED"
          echo "APK SHA256:      $ACTUAL"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then echo "APK is NOT signed with the permanent key."; exit 1; fi
          echo "OK: signed with the permanent key."

      - uses: actions/upload-artifact@v4
        with:
          name: aspire-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk