name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: flutter create --platforms=android --org pk.aspire --project-name aspire_chat .

      - name: Patch Android settings (package id, internet, app name, minSdk)
        run: |
          PKG=$(cat android_package.txt 2>/dev/null | tr -d '\r\n ')
          M=android/app/src/main/AndroidManifest.xml
          G=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          if [ -n "$PKG" ]; then
            sed -i "s/applicationId = \"[^\"]*\"/applicationId = \"$PKG\"/; s/applicationId \"[^\"]*\"/applicationId \"$PKG\"/" "$G"
          fi
          grep -q "android.permission.INTERNET" "$M" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          sed -i 's/android:label="[^"]*"/android:label="Aspire Chat"/' "$M"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$G"
          echo "--- applicationId / minSdk"; grep -n "applicationId\|minSdk" "$G" || true
          echo "--- manifest"; head -12 "$M"

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: aspire-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk